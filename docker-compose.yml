version: '3.9'
services:
  web:
    build: .
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - media_vol:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - DATABASE_URL=postgresql://locadora:locadora@db:5432/locadora
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: locadora
      POSTGRES_USER: locadora
      POSTGRES_PASSWORD: locadora
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
  media_vol:
